<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Austria 2026</title>
<meta name="description" content="Family trip companion: Austria, 19 to 27 September 2026.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Austria">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="bricolage-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="nunito-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<script>
  // Apply a saved theme before first paint.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div class="app">
  <main id="main">
    <section id="today" class="panel" aria-label="Today" hidden></section>
    <section id="itinerary" class="panel" aria-label="Itinerary" hidden></section>
    <section id="places" class="panel" aria-label="Places" hidden></section>
    <section id="info" class="panel" aria-label="Info" hidden></section>
    <noscript><p class="noscript">This page needs JavaScript to show the trip.</p></noscript>
  </main>
  <nav class="tabbar" aria-label="Main">
    <a href="#today" data-tab="today"><span class="tab-pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg></span>Today</a>
    <a href="#itinerary" data-tab="itinerary"><span class="tab-pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg></span>Itinerary</a>
    <a href="#places" data-tab="places"><span class="tab-pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>Places</a>
    <a href="#info" data-tab="info"><span class="tab-pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>Info</a>
  </nav>
</div>
<script src="app.js" defer></script>
</body>
</html>
